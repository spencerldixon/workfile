# Alice's automations for this workspace. The team can read this file.
# Only Alice's computer runs it, and only after she approves it with
# wf automations trust. See docs/automations.md.

automations:
  # Start a plan as soon as I pick up a ticket.
  - id: plan-on-pickup
    on:
      enters: doing
    agent: |
      /plan {ticket}
      Write the plan as a comment on {ticket}. Do not write code yet.
    mode: ask

  # Tell me when CI breaks on one of my PRs, and have a first look.
  - id: look-at-failing-ci
    on:
      becomes: github.checks == failure
    stage: [doing, review]
    agent: |
      CI just failed on {record} ({record_url}) for {ticket}.
      Find the failing check and explain the cause. Do not push anything.
    mode: ask

  # Every gate for done passes: check again, then merge and move the ticket.
  - id: merge-when-ready
    on:
      ready: done
    when: github.labels excludes do-not-merge
    agent: |
      Every gate for {ticket} to move to done passes.
      Run `wf check {ticket} --to done --json` first and stop if it exits
      anything but 0. Then merge its PRs and move {ticket} to done.
    mode: ask

  # A plain script, no agent: post in the team channel when work ships.
  - id: announce-done
    on:
      enters: done
    run: [./scripts/announce.sh, "{ticket}", "{url}"]
