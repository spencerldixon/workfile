<!doctype html>
<!-- Throwaway ticket detail prototype. Compare E (baseline), G (tint), H (border), and I (icons). -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workfile ticket detail · design prototype</title>
<style>
  @font-face {
    font-family: "Board Icons";
    src: local("MesloLGSNFM-Regular"), local("MesloLGS Nerd Font Mono Regular");
  }
  :root { color-scheme: dark; --bg: #191a24; --panel: #20212d; --fg: #c5ccee; --quiet: #959bb8; --red: #ff8295; --green: #8ad6a4; --amber: #e0bd80; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #11121a; color: var(--fg); font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  main { width: min(100%, 650px); min-height: 100vh; margin: auto; background: var(--bg); padding: 24px 20px 94px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  mark { background: var(--fg); color: var(--bg); padding: 2px 8px; font-weight: 800; }
  h1, h2, p, ul { margin: 0; }
  h1, h2 { font-size: inherit; }
  section { margin-top: 14px; background: var(--panel); padding: 12px 14px; }
  section > h2 { margin-bottom: 9px; }
  .quiet { color: var(--quiet); }
  .bad { color: var(--red); }
  .good { color: var(--green); }
  .wait { color: var(--amber); }
  .caption { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; }
  .prs { list-style: none; padding: 0; }
  .row { padding: 9px 0; }
  .row + .row { border-top: 1px solid #2d2f40; }
  .row:last-child { padding-bottom: 2px; }
  .pr-boxes { background: transparent; padding: 0; }
  .pr-boxes > .caption { padding: 0 14px 8px; }
  .pr-boxes .prs { display: grid; gap: 6px; }
  .pr-boxes .row { background: var(--panel); padding: 10px 14px; border: 0; }
  .pr-boxes .needs-action { background: #262431; }
  .row[data-tone="bad"] { --pr-status: var(--red); }
  .row[data-tone="wait"] { --pr-status: var(--amber); }
  .row[data-tone="good"] { --pr-status: var(--green); }
  .tint .row { background: color-mix(in srgb, var(--pr-status) 15%, var(--panel)); }
  .rail .row { background: var(--panel); box-shadow: inset 3px 0 var(--pr-status); }
  .icons .row { background: var(--panel); }
  .status-icon { display: inline-block; color: var(--pr-status); width: 1.5em; font-size: 17px; line-height: 1; }
  .status-icon .nerd { display: none; font: 1em "Board Icons"; }
  .board-icons .status-icon .nerd { display: inline; }
  .board-icons .status-icon .fallback { display: none; }
  .pr { font-weight: 700; overflow-wrap: anywhere; }
  .tag { padding: 1px 7px; border-radius: 3px; background: #2d2f41; white-space: nowrap; }
  .tag.bad { background: #392632; }
  .tag.wait { background: #35302e; }
  .tag.good { background: #233730; }
  .icons .tag { background: transparent; color: var(--quiet); padding-inline: 0; }
  .action { margin-top: 4px; }
  .action code { font: inherit; }
  .short-action { display: none; }
  .flow { margin-top: 14px; }
  canvas { display: block; width: min(100%, 548px); height: auto; margin-inline: auto; }
  .stage { text-align: center; margin-top: 2px; }
  footer { margin-top: 16px; }
  nav { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 4px; border: 1px solid #454961; border-radius: 8px; background: #272a3b; white-space: nowrap; box-shadow: 0 5px 18px #0a0b12; }
  button { background: #383d56; color: var(--fg); border: 0; border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; }
  @media (max-width: 550px) {
    .full-action { display: none; }
    .short-action { display: inline; font-size: clamp(10px, 3.6vw, 13px); }
  }
  @media (max-width: 460px) {
    main { padding-inline: 10px; }
    section { padding-inline: 10px; }
    .pr-boxes { padding-inline: 0; }
    .pr-boxes .row, .pr-boxes > .caption { padding-inline: 10px; }
    .tag { font-size: 12px; }
  }
</style>
<main>
  <header><h1><mark>Workfile</mark></h1><span class="quiet">EXAMPLE-247 · Review</span></header>
  <div id="variant"></div>
  <footer class="quiet">Checked at 11:42 · r refresh</footer>
</main>
<nav aria-label="Mockup switcher">
  <button type="button" aria-label="Previous mockup">←</button>
  <span id="variant-name" aria-live="polite"></span>
  <button type="button" aria-label="Next mockup">→</button>
</nav>
<script>
  const pullRequests = [
    { id: "example-api#4034", state: "CI failed", icon: "✗", nerd: "󰅖", tone: "bad", needsAction: true },
    { id: "example-web#182", state: "Review pending", icon: "◷", nerd: "󰆉", tone: "wait", detail: "Waiting for Alice’s review" },
    { id: "example-docs#57", state: "Merged", icon: "✓", nerd: "", tone: "good" },
  ];

  function prHeading({ id, state, icon, nerd, tone }, showNerdIcon) {
    const leading = showNerdIcon
      ? `<span class="status-icon" aria-hidden="true"><span class="nerd">${nerd}</span><span class="fallback">${icon}</span></span>`
      : '';
    const status = showNerdIcon ? state : `${icon} ${state}`;
    return `<div class="caption"><span class="pr">${leading}${id}</span><span class="tag ${tone}">${status}</span></div>`;
  }

  const labels = '<code>risk:low</code>, <code>risk:medium</code> or <code>risk:high</code>';
  function riskAction(full) {
    return `<p class="action bad"><span class="full-action">${full}</span><span class="short-action">Add ${labels}</span></p>`;
  }
  const flow = `<section class="flow">
    <h2>Workflow</h2>
    <canvas width="1096" height="316" role="img" aria-label="Workflow. Todo, Ready, Blocked, Doing, Review, Rejected, Done. The current stage is Review and the move to Done is blocked."></canvas>
    <p class="stage bad">✗ Review → Done blocked</p>
  </section>`;

  function prRow(pr, showNerdIcon) {
    const { needsAction, detail } = pr;
    const action = needsAction
      ? riskAction(`In GitHub, add ${labels}`)
      : detail ? `<p class="action quiet">${detail}</p>` : '';
    return `<li class="row${needsAction ? ' needs-action' : ''}" data-tone="${pr.tone}">
      ${prHeading(pr, showNerdIcon)}
      ${action}
    </li>`;
  }

  function prBoxes(style) {
    return `<section class="pr-boxes ${style}">
      <div class="caption"><h2>Pull requests</h2><b class="bad">1 PR needs you</b></div>
      <ul class="prs">${pullRequests.map(pr => prRow(pr, style === 'icons')).join('')}</ul>
    </section>`;
  }

  function drawWorkflow(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    const neutral = '#8d90a4';
    const red = '#ff8295';
    const green = '#8ad6a4';
    const nodes = [
      [10, 70, 54, 'Todo'], [88, 70, 63, 'Ready'], [175, 70, 78, 'Blocked'],
      [277, 70, 63, 'Doing'], [364, 70, 76, 'Review'],
      [464, 28, 74, 'Rejected'], [464, 112, 74, 'Done'],
    ];
    function edge(points, colour = neutral) {
      const [start, ...rest] = points;
      const [x, y] = rest.at(-1);
      const [prevX, prevY] = points.at(-2);
      const angle = Math.atan2(y - prevY, x - prevX);
      ctx.strokeStyle = ctx.fillStyle = colour;
      ctx.lineWidth = 1.25;
      ctx.beginPath();
      ctx.moveTo(...start);
      for (let i = 0; i < rest.length - 1; i++) ctx.arcTo(...rest[i], ...rest[i + 1], 8);
      ctx.lineTo(x - 4 * Math.cos(angle), y - 4 * Math.sin(angle));
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 7 * Math.cos(angle - .5), y - 7 * Math.sin(angle - .5));
      ctx.lineTo(x - 7 * Math.cos(angle + .5), y - 7 * Math.sin(angle + .5));
      ctx.fill();
    }
    edge([[22,70], [22,8], [501,8], [501,28]]);
    edge([[35,70], [35,22], [321,22], [321,70]]);
    edge([[120,70], [120,37], [301,37], [301,70]]);
    edge([[48,70], [48,52], [213,52], [213,70]]);
    for (let i = 0; i < 4; i++) edge([[nodes[i][0] + nodes[i][2], 84], [nodes[i + 1][0], 84]]);
    edge([[309,98], [309,122], [214,122], [214,98]]);
    edge([[402,98], [402,145], [36,145], [36,98]], green);
    edge([[440,84], [449,84], [449,126], [464,126]], red);
    for (const [x, y, width, name] of nodes) {
      ctx.fillStyle = name === 'Review' ? '#392632' : '#272938';
      ctx.beginPath();
      ctx.roundRect(x, y, width, 28, 5);
      ctx.fill();
      ctx.fillStyle = name === 'Review' ? red : '#afb5ce';
      ctx.font = `${name === 'Review' ? 'bold ' : ''}13px Menlo, monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(name, x + width / 2, y + 14);
    }
  }

  const variants = [
    { key: 'E', label: 'Baseline', style: 'baseline' },
    { key: 'G', label: 'Tinted boxes', style: 'tint' },
    { key: 'H', label: 'Status border', style: 'rail' },
    { key: 'I', label: 'Board icons', style: 'icons' },
  ];
  const requested = new URLSearchParams(location.search).get('variant');
  let index = Math.max(0, variants.findIndex(({ key }) => key === requested));
  function render() {
    const { key, label, style } = variants[index];
    document.querySelector('#variant').innerHTML = flow + prBoxes(style);
    document.querySelector('#variant-name').textContent = `${key} · ${label}`;
    drawWorkflow(document.querySelector('canvas'));
  }

  function toggle(direction) {
    index = (index + direction + variants.length) % variants.length;
    const url = new URL(location.href);
    url.searchParams.set('variant', variants[index].key);
    history.replaceState(null, '', url);
    render();
  }

  const [previous, next] = document.querySelectorAll('nav button');
  previous.addEventListener('click', () => toggle(-1));
  next.addEventListener('click', () => toggle(1));
  document.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft') toggle(-1);
    if (event.key === 'ArrowRight') toggle(1);
  });
  document.fonts.load('1em "Board Icons"').then(fonts => {
    if (fonts.length) document.documentElement.classList.add('board-icons');
  }).catch(() => {});
  render();
</script>
</html>
