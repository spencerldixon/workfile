<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workfile Inbox · Terminal prototypes</title>
<!-- Three throwaway CLI layouts, switchable via ?variant=A, B or C. -->
<style>
:root{color-scheme:dark;--outside:#101211;--term:#191c1b;--panel:#222624;--text:#edf0eb;--dim:#a4afa6;--red:#f08e8e;--green:#a7d7a2;--cyan:#a1d7dc}
*{box-sizing:border-box}
body{margin:0;background:var(--outside);color:var(--text);font:14px/1.55 system-ui,sans-serif}
main{max-width:1160px;margin:auto;padding:clamp(16px,5vw,66px) clamp(12px,4vw,48px) 100px}
header{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;letter-spacing:-.055em;margin:0 0 8px}
p{margin:0}.quiet,header p{color:var(--dim)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.controls{display:flex;gap:6px;flex-wrap:wrap}
.controls button,nav button{border:1px solid #434c46;border-radius:5px;background:var(--term);padding:5px 10px}
.controls [aria-pressed=true]{background:var(--text);color:var(--term)}
.frame{width:100%;margin:auto;border:1px solid #323a34;border-radius:11px;overflow:hidden;background:var(--term);box-shadow:0 18px 55px #0004}
.frame.narrow{max-width:calc(40ch + 26px)}
.narrow .terminal{padding:12px}
.frame,.terminal{font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
.chrome{padding:9px 18px;background:var(--panel);color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.terminal{padding:clamp(12px,2vw,24px);min-height:450px;display:flex;flex-direction:column;gap:18px}
.line,.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.summary{display:flex;gap:0 16px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);gap:2ch}
.panel{padding:1ch 1.6ch;background:var(--panel);min-width:0;overflow-wrap:anywhere}
.panel+.panel{margin-top:1ch}
.label{display:block;margin-bottom:5px}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-left:1px solid transparent;padding:5px 1ch;color:inherit;overflow-wrap:anywhere}
.row.selected{border-color:var(--text);background:var(--panel)}
.row .reason{display:block;padding-left:2ch}
.age{margin-left:auto;color:var(--dim)}
.row .line{justify-content:start;flex-wrap:nowrap}
.group+.group{margin-top:16px}
.row+.row{margin-top:2px}
.red{color:var(--red)}.green{color:var(--green)}.cyan{color:var(--cyan)}
.detail h2{font:inherit;font-weight:bold;margin:0 0 1ch}
.detail p+p{margin-top:6px}
.focus .detail{max-width:74ch;margin:auto;width:100%}
.queue{max-width:100%}
.queue .reason{display:inline;padding:0}
.queue .row .line{display:grid;grid-template-columns:2ch 8ch minmax(0,1fr) auto;align-items:baseline}
.keys{margin-top:auto;display:flex;gap:5px 1.5ch;flex-wrap:wrap}
kbd{font:inherit;font-weight:bold;color:var(--text)}
nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px;background:var(--panel);border:1px solid #434c46;border-radius:9px;white-space:nowrap;box-shadow:0 6px 24px #0008}
.plain .panel,.plain .row.selected{background:none}
.plain .row.selected{border-color:transparent}
.plain .row.selected b::before{content:"› "}
.plain .red,.plain .green,.plain .cyan,.plain .age,.plain .terminal .quiet{color:inherit}
.narrow .split,.narrow .queue .row .line{display:block}
.narrow .queue .row .reason{display:block;padding-left:2ch}
@media(max-width:720px){.split{display:block}.queue .row .line{display:block}.queue .row .reason{display:block;padding-left:2ch}}
</style>
<main>
<header>
<div><h1>Inbox design review</h1><p>Interactive terminal mocks · sample data</p></div>
<div class="controls">
<button id="narrow" aria-pressed="false">40 columns</button>
<button id="plain" aria-pressed="false">Plain output</button>
<button id="scenario">Show inbox zero</button>
</div>
</header>
<section class="frame" id="frame" aria-label="Terminal preview">
<div class="chrome"><span>$ wf inbox</span><span id="mode">Terminal preview</span></div>
<div class="terminal" id="terminal"></div>
</section>
</main>
<nav aria-label="Choose a design">
<button id="prev" aria-label="Previous design">←</button><b id="variant-name"></b><button id="next" aria-label="Next design">→</button>
</nav>
<script>
const rows = [
  {key:'APP-42', pr:'#84', title:'Preserve sign-in redirects', icon:'✗', tone:'red', reason:'Changes requested on #84', age:'3h', next:'Address Bob’s review on #84', who:'Bob · auth/redirect.go:41', event:'Can we keep the original destination after sign-in?'},
  {key:'APP-51', pr:'#97', title:'Retry failed imports', icon:'●', tone:'cyan', reason:'Alice requested your review on #97', age:'1h', next:'Review #97', who:'Alice · #97', event:'Requested your review.'},
  {key:'APP-39', title:'Show import progress', icon:'✓', tone:'green', reason:'Ready to move to release', age:'18m', next:'Move APP-39 to release', who:'Charlie · APP-39', event:'QA passed.'},
  {key:'APP-48', pr:'#91', title:'Clean up archived jobs', icon:'○', reason:'Charlie approved #91', age:'5m', who:'Charlie · #91', event:'Approved the pull request.'},
  {key:'APP-37', title:'Document import settings', icon:'○', reason:'Alice commented on APP-37', age:'24m', who:'Alice · APP-37', event:'The examples now cover both import modes.'}
];
const names = ['Split view','Focus','Queue'];
const variants = ['A','B','C'];
const $ = id => document.getElementById(id);
let variant = Math.max(0, variants.indexOf(new URLSearchParams(location.search).get('variant')));
let selected = 0, detail = false, narrow = false, plain = false, zero = false;
const activeRows = () => zero ? rows.slice(3) : rows;
const narrowScreen = () => narrow || matchMedia('(max-width:720px)').matches;
function queue() {
  const items = activeRows();
  const row = (r,i) => {
    const current = i === selected;
    const mark = '<span class="' + (r.tone || 'quiet') + '">' + r.icon + '</span>';
    const key = '<b>' + r.key + '</b>';
    const reason = '<span class="reason">' + r.reason + '</span>';
    const age = '<span class="age">' + r.age + '</span>';
    const line = variant === 2
      ? '<span class="line">' + mark + key + reason + age + '</span>'
      : '<span class="line">' + mark + key + age + '</span>' + reason;
    return '<button class="row ' + (current ? 'selected' : '') + '" data-row="' + i + '" aria-current="' + current + '" aria-label="' + (current ? 'Selected. ' : '') + r.key + ', ' + r.reason + '">' + line + '</button>';
  };
  return (zero ? '' : '<section class="group"><b class="label">Needs you</b>' + items.slice(0,3).map(row).join('') + '</section>') +
    '<section class="group"><b class="label">Updates</b>' + items.slice(-2).map((r,i) => row(r,items.length-2+i)).join('') + '</section>';
}
function preview(r) {
  return '<section class="detail"><h2>' + r.key + ' <span class="quiet">' + (r.pr || '') + '</span><br>' + r.title + '</h2>' +
    (r.next ? '<section class="panel"><b class="label">Next step</b><span class="' + r.tone + '">' + r.icon + '</span> ' + r.next + '</section>' : '') +
    '<section class="panel"><b class="label">Latest activity</b><p class="meta"><span>' + r.who + '</span><span class="quiet">' + r.age + '</span></p><p>' + r.event + '</p></section></section>';
}
function render() {
  const items = activeRows();
  const r = items[selected];
  const wideSplit = variant === 0 && !narrowScreen();
  const showingDetail = variant === 1 ? !detail : detail;
  let body;
  if (wideSplit) body = '<div class="split"><div>' + queue() + '</div>' + preview(r) + '</div>';
  else if (showingDetail) {
    const position = variant === 1 ? '<p class="quiet">' + (selected+1) + ' of ' + items.length + ' · ' + (r.next ? 'Needs you' : 'Updates') + '</p>' : '';
    body = position + preview(r);
  } else body = '<div class="queue">' + queue() + '</div>';
  const toggle = wideSplit ? '' : showingDetail ? '<span><kbd>' + (variant === 1 ? '↵' : 'esc') + '</kbd> list</span>' : '<span><kbd>↵</kbd> details</span>';
  $('frame').className = 'frame' + (narrow ? ' narrow' : '') + (plain ? ' plain' : '');
  $('mode').textContent = narrow ? '40 columns' : 'Terminal preview';
  $('terminal').className = 'terminal' + (variant === 1 ? ' focus' : '');
  $('terminal').innerHTML =
    '<div><div class="line"><b>workfile / Inbox</b><span class="quiet">Synced 1m ago</span></div>' +
    '<p class="summary">' + (zero ? '<b class="green">✓ Nothing needs you</b>' : '<b>3 need you</b>') + '<span class="quiet">2 updates</span></p></div>' +
    body + '<footer class="keys quiet"><span><kbd>j/k</kbd> move</span>' + toggle +
    '<span><kbd>o</kbd> open ' + (r.pr || r.key) + '</span><span><kbd>e</kbd> ' + (r.next ? 'done' : 'read') +
    '</span><span><kbd>s</kbd> snooze</span><span><kbd>a</kbd> agent</span><span><kbd>r</kbd> refresh</span><span><kbd>q</kbd> quit</span></footer>';
  $('variant-name').textContent = variants[variant] + ' · ' + names[variant];
  $('narrow').setAttribute('aria-pressed', narrow);
  $('plain').setAttribute('aria-pressed', plain);
  $('scenario').textContent = zero ? 'Show incoming work' : 'Show inbox zero';
}
function cycle(step) {
  variant = (variant + step + names.length) % names.length;
  detail = false;
  const url = new URL(location.href);
  url.searchParams.set('variant', variants[variant]);
  try { history.replaceState(null, '', url); } catch {}
  render();
}
$('terminal').onclick = e => {
  const button = e.target.closest('[data-row]');
  if (!button) return;
  selected = Number(button.dataset.row);
  detail = variant !== 1;
  render();
};
$('prev').onclick = () => cycle(-1);
$('next').onclick = () => cycle(1);
$('narrow').onclick = () => { narrow = !narrow; render(); };
$('plain').onclick = () => { plain = !plain; render(); };
$('scenario').onclick = () => { zero = !zero; selected = 0; detail = false; render(); };
window.addEventListener('resize', render);
window.addEventListener('keydown', e => {
  const move = {j:1, k:-1, ArrowDown:1, ArrowUp:-1}[e.key];
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') cycle(e.key === 'ArrowLeft' ? -1 : 1);
  else if (move) selected = Math.max(0, Math.min(activeRows().length-1, selected+move));
  else if (e.key === 'Enter' && !e.target.closest('button')) detail = !detail;
  else if (e.key === 'Escape') detail = variant === 1;
  else return;
  e.preventDefault();
  render();
});
render();
</script>
</html>
