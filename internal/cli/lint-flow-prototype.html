<!doctype html>
<!-- Throwaway prototype: three Kitty flow layouts for the same branching policy excerpt. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workfile lint · Flow prototypes</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui, sans-serif; background: #101216; color: #eceef0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: clamp(18px, 5vw, 72px) clamp(14px, 5vw, 60px) 100px; }
  main { max-width: 1140px; margin: auto; }
  h1 { margin: 0 0 22px; font-size: clamp(25px, 4vw, 38px); letter-spacing: -.045em; }
  .terminal { background: #191c21; border: 1px solid #32363e; border-radius: 12px; padding: clamp(14px, 3vw, 28px); }
  .command, .verdict { font-family: ui-monospace, monospace; }
  .command { color: #aeb5bf; }
  .verdict { color: #f5ca85; margin: 14px 0 18px; }
  h2 { margin: 0 0 5px; font-size: 17px; }
  p { margin: 0; color: #afb6c0; line-height: 1.55; }
  .scroll { overflow-x: auto; margin: 14px 0 0; }
  canvas { display: block; max-width: none; }
  .description { margin: 14px 0 0; }
  nav { display: flex; align-items: center; gap: 8px; position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #262a32; border: 1px solid #494f5c; border-radius: 40px; padding: 6px; box-shadow: 0 5px 18px #0007; }
  nav span { width: 157px; text-align: center; white-space: nowrap; font-weight: 650; }
  button { border: 0; border-radius: 50%; width: 38px; height: 38px; background: #3b414c; color: white; font: inherit; cursor: pointer; }
  button:hover { background: #525a69; }
  button:focus-visible { outline: 2px solid #a7e4bc; outline-offset: 2px; }
</style>
<main>
  <h1>Gate layouts for the Kitty diagram</h1>
  <section class="terminal" aria-labelledby="flow-title">
    <div class="command">wf lint --dir example/branching</div>
    <div class="verdict">! Pass · 4 gates can be skipped</div>
    <h2 id="flow-title">Flow</h2>
    <p>Branching example excerpt from doing to release, with returns.</p>
    <div class="scroll" id="scroll">
      <canvas id="flow" role="img" aria-label="Doing moves to review after linked_pull_requests and risk_assessment. Review moves to QA after code_review, security after threat_model, or release after code_review and release_waiver. QA and security move to release after their respective signoffs. Review, QA and security can return to doing after rework_note."></canvas>
    </div>
  </section>
  <p class="description" id="description" aria-live="polite"></p>
</main>
<nav aria-label="Prototype layouts">
  <button id="previous" aria-label="Previous layout">←</button>
  <span id="variant"></span>
  <button id="next" aria-label="Next layout">→</button>
</nav>
<script>
const canvas = document.querySelector('#flow');
const ctx = canvas.getContext('2d');
const paper = '#191c21';
const stageInk = '#e6eaf0';
const neutral = '#7f8a9b';
const gated = '#83c8a0';
const gap = '#f38d8d';

function path(points, color, arrow = true, dashed = false) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round';
  ctx.setLineDash(dashed ? [5, 5] : []);
  ctx.beginPath();
  points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.stroke();
  ctx.setLineDash([]);
  if (!arrow) return;
  const [x, y] = points.at(-1);
  const [px, py] = points.at(-2);
  const angle = Math.atan2(y - py, x - px);
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (const offset of [-.52, .52]) {
    ctx.lineTo(x - 8 * Math.cos(angle + offset), y - 8 * Math.sin(angle + offset));
  }
  ctx.fill();
}

function stage(x, y, name) {
  ctx.fillStyle = '#303640';
  ctx.strokeStyle = '#515a68';
  ctx.beginPath();
  ctx.roundRect(x - 47, y - 17, 94, 34, 7);
  ctx.fill();
  ctx.stroke();
  ctx.font = '600 14px system-ui, sans-serif';
  ctx.fillStyle = stageInk;
  ctx.fillText(name, x, y);
}

function gate(x, y, names, color, offEdge) {
  ctx.font = '12px ui-monospace, monospace';
  if (offEdge) {
    path([[x, y + 10], [x, y + 27]], neutral, false);
    ctx.fillStyle = color;
    ctx.fillText('◆ ' + names.join(' · '), x, y);
    return;
  }
  const width = Math.max(...names.map(name => ctx.measureText(name).width)) / 2 + 18;
  const height = 6 + names.length * 7;
  ctx.fillStyle = paper;
  ctx.strokeStyle = color;
  ctx.beginPath();
  for (const [i, [dx, dy]] of [[-width, 0], [-width + 10, -height], [width - 10, -height],
    [width, 0], [width - 10, height], [-width + 10, height]].entries()) {
    if (i === 0) ctx.moveTo(x + dx, y + dy);
    else ctx.lineTo(x + dx, y + dy);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = color;
  names.forEach((name, i) => ctx.fillText(name, x, y + (i - (names.length - 1) / 2) * 14));
}

function workflow({ width, review, branch, release, offEdge = false, shared = false }) {
  const doing = 64;
  const main = 164;
  const qa = 100;
  const security = 241;
  const returns = 313;
  const outward = review + 60;
  const inward = release - 62;
  const shortcut = 38;
  const branchY = qa - 51;
  const fork = branch - 102;
  const labelY = y => y - (offEdge ? 27 : 0);
  const [start, end] = [doing + 47, review - 47];
  path([[start, main], [end, main]], gated);
  if (shared) {
    path([[review, main - 17], [review, branchY], [fork, branchY]], gated, false);
    path([[fork, branchY], [branch, branchY], [branch, qa - 17]], gated);
    path([[fork, branchY], [fork, shortcut - 15], [release, shortcut - 15], [release, main - 17]], gap);
  } else {
    path([[review, main - 17], [review, shortcut], [release, shortcut], [release, main - 17]], gap);
    path([[review + 47, main], [outward, main], [outward, qa], [branch - 47, qa]], gated);
  }
  path([[review + 47, main], [outward, main], [outward, security], [branch - 47, security]], gated);
  path([[branch + 47, qa], [inward, qa], [inward, main], [release - 47, main]], gap);
  path([[branch + 47, security], [inward, security], [inward, main], [release - 47, main]], gap);

  // A gap at the crossing keeps QA's return separate from security's forward move.
  const returnFromQA = branch + 55;
  path([[branch, qa + 17], [branch, security - 50], [returnFromQA, security - 50], [returnFromQA, security - 6]], neutral, false, true);
  path([[returnFromQA, security + 6], [returnFromQA, returns], [branch, returns]], neutral, false, true);
  path([[branch, security + 17], [branch, returns], [review, returns]], neutral, false, true);
  path([[review, main + 17], [review, returns], [doing, returns], [doing, main + 17]], neutral, true, true);
  for (const x of [review, branch]) {
    ctx.fillStyle = neutral;
    ctx.beginPath();
    ctx.arc(x, returns, 3, 0, 2 * Math.PI);
    ctx.fill();
  }

  gate((start + end) / 2, labelY(main), ['linked_pull_requests', 'risk_assessment'], gated, offEdge);
  gate((outward + branch - 47) / 2, labelY(security), ['threat_model'], gated, offEdge);
  gate((branch + 47 + inward) / 2, labelY(qa), ['qa_signoff'], gap, offEdge);
  gate((branch + 47 + inward) / 2, labelY(security), ['security_signoff'], gap, offEdge);
  gate((doing + review) / 2, labelY(returns), ['rework_note'], gated, offEdge);
  if (shared) {
    gate((review + fork) / 2, branchY, ['code_review'], gated, false);
    gate((fork + release) / 2, shortcut - 15, ['release_waiver'], gap, false);
    ctx.fillStyle = gated;
    ctx.beginPath();
    ctx.arc(fork, branchY, 3, 0, 2 * Math.PI);
    ctx.fill();
  } else {
    gate((outward + branch - 47) / 2, labelY(qa), ['code_review'], gated, offEdge);
    gate((review + release) / 2, labelY(shortcut), ['code_review', 'release_waiver'], gap, offEdge);
  }
  stage(doing, main, 'Doing');
  stage(review, main, 'Review');
  stage(branch, qa, 'QA');
  stage(branch, security, 'Security');
  stage(release, main, 'Release');
}

const variants = [
  { id: 'inline', name: 'Inline gates', width: 1080, review: 340, branch: 665, release: 1010,
    description: 'Gate names sit inside pointed shapes on each move. Parallel checks stack inside the same shape.' },
  { id: 'labels', name: 'Labels above moves', width: 890, review: 265, branch: 545, release: 820, offEdge: true,
    description: 'Small diamond labels sit above their connectors. The names can overhang a short connector, keeping the graph narrower.' },
  { id: 'shared', name: 'Shared gate paths', width: 1060, review: 332, branch: 660, release: 995, shared: true,
    description: 'One code_review gate feeds both QA and the release shortcut. The return routes also meet at one rework_note gate.' },
];

let selected = Math.max(0, variants.findIndex(option => option.id === new URL(location.href).searchParams.get('variant')));
function show(offset = 0) {
  selected = (selected + offset + variants.length) % variants.length;
  const option = variants[selected];
  const url = new URL(location.href);
  url.searchParams.set('variant', option.id);
  history.replaceState(null, '', url);
  document.querySelector('#variant').textContent = option.name;
  document.querySelector('#description').textContent = option.description;
  document.querySelector('#scroll').scrollLeft = 0;
  const scale = devicePixelRatio || 1;
  canvas.width = option.width * scale;
  canvas.height = 344 * scale;
  canvas.style.width = option.width + 'px';
  canvas.style.height = '344px';
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  workflow(option);
}
document.querySelector('#previous').onclick = () => show(-1);
document.querySelector('#next').onclick = () => show(1);
document.addEventListener('keydown', event => {
  if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
  event.preventDefault();
  show(event.key === 'ArrowLeft' ? -1 : 1);
});
show();
</script>
</html>
