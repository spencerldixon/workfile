<!doctype html>
<!-- Throwaway prototype. Compare a continuous reader (?variant=reader) with section tabs (?variant=tabs). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workfile ticket reader prototype</title>
  <style>
    @font-face {
      font-family: "Ticket Icons";
      src: local("MesloLGS Nerd Font Mono"), local("MesloLGSNFM-Regular"),
        local("JetBrainsMono Nerd Font Mono");
    }
    :root {
      color-scheme: dark;
      --base: #191a24;
      --panel: #232533;
      --text: #c6cdef;
      --quiet: #9da7c6;
      --link: #8bd6fa;
      --bad: #ff9ba9;
      --selection: #c6cdef;
      --ink: #191a24;
      font: 14px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem 1rem 4rem; height: 100dvh; background: #13141b; color: var(--text); }
    .terminal { height: 100%; max-width: 88rem; margin: 0 auto; background: var(--base); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    header { padding: .9rem 1.15rem .7rem; }
    .masthead, .identity { display: flex; align-items: baseline; flex-wrap: wrap; gap: .35rem 1rem; }
    .masthead, .meta, .quiet, footer { color: var(--quiet); }
    .masthead { justify-content: space-between; padding-bottom: .75rem; }
    .tags { display: flex; flex-wrap: wrap; gap: .35rem .45rem; }
    .tags[hidden] { display: none; }
    .tag { display: inline-flex; align-items: center; gap: .5ch; padding: .06rem .65rem; border-radius: 1rem; font-size: .88rem; }
    .tag-icon { font: 1em/1 "Ticket Icons", monospace; }
    .tag-type { background: #26384c; color: #a8d5fb; }
    .tag-status { background: #3b3150; color: #d7bff6; }
    .tag-assignee { background: #243b39; color: #ace2d5; }
    h1, h2 { font-family: ui-sans-serif, system-ui, sans-serif; line-height: 1.18; }
    h1 { margin: .45rem 0 .4rem; max-width: 34ch; font-size: clamp(1.4rem, 3vw, 2rem); }
    h2 { font-size: 1.35rem; margin: .3rem 0 .65rem; }
    h3, p, ul { margin: 0; }
    h3 { font-size: 1rem; }
    article p + p, article ul, article pre { margin-top: .6rem; }
    article ul { padding-left: 2ch; }
    article section + section { margin-top: 1.45rem; }
    article section + #comments { margin-top: 1.8rem; padding-top: .85rem; border-top: 1px solid #35394c; }
    article section { scroll-margin-top: .9rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(13rem, 23rem); gap: 1.3rem; padding: 0 1.15rem; min-height: 0; }
    .document, aside { overflow: auto; min-height: 0; scrollbar-width: thin; }
    .document { padding: .7rem 1rem .9rem 0; }
    article { max-width: 76ch; overflow-wrap: anywhere; }
    aside { padding: .7rem 0; }
    .panel { background: var(--panel); padding: .65rem .8rem; margin-bottom: .75rem; }
    .panel p { margin-top: .35rem; }
    .outline { display: flex; flex-direction: column; margin-top: .35rem; }
    .outline a { display: block; padding: .14rem .25rem; color: var(--text); text-decoration: none; }
    .outline a[aria-current="location"] { background: var(--selection); color: var(--ink); }
    .attention { color: var(--bad); }
    code, a { color: var(--link); }
    pre { padding: .65rem; background: var(--panel); overflow: auto; margin-bottom: 0; }
    button { font: inherit; color: inherit; background: transparent; border: 0; padding: .2rem .45rem; cursor: pointer; }
    button:hover, .outline a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible, .document:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
    .section-nav { display: flex; flex-wrap: wrap; gap: .35rem; padding: .15rem .1rem .45rem; }
    .section-nav button[aria-pressed="true"] { background: var(--selection); color: var(--ink); }
    .tabbed-document { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; padding-top: .7rem; }
    footer { padding: .55rem 1.15rem; }
    .switcher { position: fixed; left: 50%; bottom: .55rem; transform: translateX(-50%); display: flex; align-items: center; width: max-content; gap: .45rem; padding: .25rem; border-radius: 2rem; background: var(--selection); color: var(--ink); box-shadow: 0 2px 12px #0008; }
    .switcher button:focus-visible { outline-color: var(--ink); }
    @media (max-width: 760px) {
      body { padding: 0 0 3.7rem; }
      .layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 0; }
      aside { grid-row: 1; max-height: 11rem; padding-bottom: 0; }
      .panel { margin-bottom: .4rem; }
      .outline { flex-direction: row; flex-wrap: wrap; gap: .25rem; }
      .document { padding-right: .2rem; }
    }
  </style>
</head>
<body>
  <main class="terminal">
    <header>
      <div class="masthead"><b>workfile / tracker</b><span>Esc back to Board</span></div>
      <div class="identity">
        <b>APP-42</b>
        <div class="tags" id="ticket-tags" aria-label="Ticket metadata">
          <span class="tag tag-type"><span class="tag-icon" aria-hidden="true">&#xf02d;</span> Story</span>
          <span class="tag tag-status"><span class="tag-icon" aria-hidden="true">&#xf06e;</span> In Review</span>
          <span class="tag tag-assignee"><span class="tag-icon" aria-hidden="true">&#xf007;</span> Alice</span>
        </div>
        <span class="meta" id="ticket-meta" hidden>Story · In Review · Alice</span>
      </div>
      <h1>Stop loading every region one at a time</h1>
    </header>
    <div id="screen" class="layout"></div>
    <footer id="shortcuts"></footer>
  </main>
  <nav class="switcher" aria-label="Prototype layouts">
    <button type="button" id="previous" aria-label="Previous layout">←</button>
    <b id="variant-label" aria-live="polite"></b>
    <button type="button" id="next" aria-label="Next layout">→</button>
  </nav>
  <script>
    const sections = [
      ['summary', 'Summary', `
        <p>The shipping options endpoint loads each region name in a separate database query. Accounts with many regions see a slow checkout.</p>
        <p>Load region names together. The response should keep the same names and order.</p>`],
      ['background', 'Background', `
        <p>Checkout asks the shipping service for the zones available to the current account. Small accounts have a few zones. Large accounts can include every region.</p>
        <p>Each zone includes a list of region names. The serializer currently asks for those names individually as it walks the zone list. Checkout waits for the entire response before showing delivery options.</p>`],
      ['technical', 'Technical', `
        <p><b>Evidence</b></p>
        <ul><li>A test account with 180 regions made 182 SQL queries during response rendering.</li><li>Most queries were individual reads from <code>region_names</code>.</li></ul>
        <p style="margin-top:.65rem"><b>Reproduce</b></p>
        <ul><li>Open checkout for the test account with every zone enabled.</li><li>Request <code>GET /api/shipping/options</code> twice and compare the SQL logs.</li></ul>
        <pre><code>SELECT name FROM region_names
WHERE region_id = ?</code></pre>
        <p style="margin-top:.65rem"><b>Files</b></p>
        <ul><li><code>app/serializers/shipping_zone_serializer.rb</code> expands the list of region names.</li><li><code>app/queries/shipping_options_query.rb</code> loads the zones for the account.</li></ul>`],
      ['acceptance', 'Acceptance criteria', `
        <ul><li>Query count stays fixed as regions are added.</li><li>The response keeps the existing names and ordering.</li><li>A regression test covers a zone with several regions.</li></ul>`],
      ['comments', 'Comments (2)', `
        <div class="panel"><h3>Bob <span class="quiet">· yesterday</span></h3><p>Please keep the ordering contract in the regression test.</p></div>
        <div class="panel"><h3>Alice <span class="quiet">· today</span></h3><p>The test account with every zone enabled is ready.</p></div>`],
    ];
    const labels = {reader: 'A · Continuous reader', tabs: 'B · Section tabs'};
    const variants = Object.keys(labels);
    const screen = document.querySelector('#screen');
    const shortcuts = document.querySelector('#shortcuts');
    const startingVariant = new URLSearchParams(location.search).get('variant');
    let variant = variants.includes(startingVariant) ? startingVariant : 'reader';

    function workfile() {
      return `<section class="panel" aria-label="Workfile"><h3>Workfile</h3>
        <p>Doing → [Review] → Done</p>
        <p class="attention">✗ 1. Fix failing checks on checkout#42</p>
        <p class="quiet">Unblocks → Done</p></section>`;
    }

    function sectionBlock([id, title, body]) {
      return `<section id="${id}"><h2>${title}</h2>${body}</section>`;
    }

    function renderReader() {
      screen.innerHTML = `<div class="document" tabindex="0" aria-label="Ticket description">
          <article>${sections.map(sectionBlock).join('')}</article></div>
        <aside>${workfile()}<section class="panel"><h3>On this ticket</h3>
          <nav class="outline" aria-label="Jump to a section">${sections.map(([id, title]) =>
            `<a href="#${id}">${title}</a>`).join('')}</nav></section></aside>`;
      const links = [...screen.querySelectorAll('.outline a')];
      links[0].setAttribute('aria-current', 'location');
      links.forEach(link => link.addEventListener('click', event => {
        event.preventDefault();
        links.forEach(item => item.removeAttribute('aria-current'));
        link.setAttribute('aria-current', 'location');
        document.getElementById(link.hash.slice(1)).scrollIntoView({block: 'start'});
      }));
      shortcuts.textContent = 'g jump to a section · scroll to read';
    }

    function renderTabs() {
      screen.innerHTML = `<div class="tabbed-document">
          <nav class="section-nav" aria-label="Ticket sections">${sections.map(([id, title]) =>
            `<button type="button" data-section="${id}" aria-pressed="false">${title}</button>`).join('')}</nav>
          <div class="document" tabindex="0" aria-label="Selected ticket section"><article></article></div>
        </div><aside>${workfile()}</aside>`;
      const buttons = [...screen.querySelectorAll('[data-section]')];
      const pane = screen.querySelector('.document');
      function select(button) {
        buttons.forEach(item => item.setAttribute('aria-pressed', item === button));
        pane.querySelector('article').innerHTML = sectionBlock(sections.find(([id]) => id === button.dataset.section));
        pane.scrollTop = 0;
      }
      buttons.forEach(button => button.addEventListener('click', () => select(button)));
      select(buttons[0]);
      shortcuts.textContent = 'g choose a section · scroll to read';
    }

    function render() {
      document.querySelector('#variant-label').textContent = labels[variant];
      document.querySelector('#ticket-tags').hidden = variant !== 'reader';
      document.querySelector('#ticket-meta').hidden = variant === 'reader';
      if (variant === 'reader') renderReader();
      else renderTabs();
    }

    function cycle(step) {
      variant = variants[(variants.indexOf(variant) + step + variants.length) % variants.length];
      const url = new URL(location.href);
      url.searchParams.set('variant', variant);
      history.replaceState(null, '', url);
      render();
    }
    document.querySelector('#previous').addEventListener('click', () => cycle(-1));
    document.querySelector('#next').addEventListener('click', () => cycle(1));
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        cycle(event.key === 'ArrowRight' ? 1 : -1);
      }
      if (event.key === 'g') screen.querySelector('.outline a, .section-nav button')?.focus();
    });
    render();
  </script>
</body>
</html>
